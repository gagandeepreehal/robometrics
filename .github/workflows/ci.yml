name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.9"
            install-target: ".[dev]"
          - python-version: "3.10"
            install-target: ".[dev]"
          - python-version: "3.11"
            install-target: ".[dev]"
          - python-version: "3.12"
            install-target: ".[dev,io]"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e "${{ matrix.install-target }}"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy --python-version "${{ matrix.python-version }}" robometrics
      - name: Pytest
        run: pytest --cov=robometrics --cov-report=term-missing --cov-fail-under=90
      - name: Examples smoke test
        run: |
          python examples/basic_metrics.py
          python examples/evaluator_quickstart.py
          python examples/thresholds.py
          python examples/export_results.py
          python examples/trajectory_metrics.py
          python examples/prediction_metrics.py
          python examples/driving_metrics.py
          python examples/safety_metrics.py
          python examples/comfort_metrics.py
          python examples/load_from_csv.py
          python examples/evaluator_usage.py
          python examples/manipulation_metrics.py
          python examples/probabilistic_prediction.py
          python examples/custom_metric_pack.py
          python examples/history_summary.py
