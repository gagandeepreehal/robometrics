name: RoboMetrics Regression Example

on:
  workflow_dispatch:

jobs:
  regression-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev,io]"
      - name: Validate fixture data
        run: python -m robometrics validate examples/fixtures/predictions.csv
      - name: Evaluate regression fixture
        run: |
          python -m robometrics evaluate \
            --pred examples/fixtures/predictions.csv \
            --gt examples/fixtures/ground_truth.csv \
            --metrics ade fde \
            --threshold ade=0.5 \
            --threshold fde=1.0 \
            --output result.json
      - name: Compare against baseline
        run: python -m robometrics compare examples/fixtures/baseline_result.json result.json
      - name: Generate report
        run: python -m robometrics report result.json --output report.html
      - uses: actions/upload-artifact@v4
        with:
          name: robometrics-report
          path: report.html
