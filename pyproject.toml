[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robometrics"
version = "0.2.0"
description = "Lightweight robotics metrics for Python."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "RoboMetrics contributors" }]
maintainers = [{ name = "RoboMetrics contributors" }]
keywords = [
  "robotics",
  "metrics",
  "trajectory",
  "trajectories",
  "evaluation",
  "benchmarking",
  "ADE",
  "FDE",
  "collision",
  "safety",
  "autonomous",
  "policy evaluation",
  "robot learning",
  "imitation learning",
  "motion planning",
  "prediction",
  "numpy",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
]

[project.optional-dependencies]
io = ["pandas>=1.5"]
docs = ["mkdocs>=1.6"]
mcap = ["mcap>=1.2"]
wandb = ["wandb>=0.16"]
mlflow = ["mlflow>=2.10"]
loggers = [
  "mlflow>=2.10",
  "wandb>=0.16",
]
dev = [
  "coverage[toml]>=7",
  "mypy>=1.10,<1.18",
  "pandas>=1.5",
  "pre-commit>=3.5",
  "pytest-cov>=5",
  "pytest>=8",
  "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/gagandeepreehal/robometrics"
Documentation = "https://gagandeepreehal.github.io/robometrics/"
Source = "https://github.com/gagandeepreehal/robometrics"
Issues = "https://github.com/gagandeepreehal/robometrics/issues"
Changelog = "https://github.com/gagandeepreehal/robometrics/blob/main/CHANGELOG.md"

[project.scripts]
robometrics = "robometrics.cli:main"

[tool.setuptools.packages.find]
include = ["robometrics*"]

[tool.setuptools.package-data]
robometrics = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["UP007", "UP045"]

[tool.mypy]
python_version = "3.9"
packages = ["robometrics"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pandas.*", "scipy.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["robometrics"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
