site_name: RoboMetrics
site_description: Lightweight robotics metrics for Python.
site_url: https://gagandeepreehal.github.io/robometrics/
repo_url: https://github.com/gagandeepreehal/robometrics
repo_name: gagandeepreehal/robometrics
edit_uri: edit/main/docs/
use_directory_urls: true
strict: true

theme:
  name: readthedocs
  highlightjs: true
  hljs_languages:
    - bash
    - python
    - yaml

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - sane_lists
  - tables
  - toc:
      permalink: true
      toc_depth: 3

extra_css:
  - stylesheets/extra.css

nav:
  - Start Here:
      - Overview: index.md
      - Quickstart: quickstart.md
      - What It Is: what_it_is.md
      - Run From Policy Output: guides/policy_output.md
  - Core API:
      - Evaluation Guide: evaluation.md
      - Evaluator Examples: evaluator.md
      - Input And Output Contract: input_output_contract.md
      - CLI Commands: cli.md
      - API Reference: api.md
  - Metrics:
      - Metric Catalog: metrics.md
      - Trajectory: metrics/trajectory.md
      - Prediction: metrics/prediction.md
      - Driving: metrics/driving.md
      - Safety: metrics/safety.md
      - Comfort: metrics/comfort.md
      - Physics: metrics/physics.md
      - Task: metrics/task.md
      - Manipulation: metrics/manipulation.md
      - Calibration: metrics/calibration.md
      - Coverage: metrics/coverage.md
      - Diversity: metrics/diversity.md
      - Temporal: metrics/temporal.md
  - Guides:
      - Adapter Guide: adapters.md
      - Benchmark Profiles: benchmark_profiles.md
      - Validation Suite: validation_suite.md
      - Loader Examples: guides/loader_examples.md
      - Result Schema Migration: guides/result_schema_migration.md
      - Comparing Policies: guides/comparing_policies.md
      - CI Integration: guides/ci_integration.md
      - Writing a Pack: guides/writing_a_pack.md
      - ROS Adapter: guides/ros_adapter.md
  - Project:
      - Performance: performance.md
      - Roadmap: roadmap.md
      - Contributing: contributing.md
      - Publishing: publishing.md
